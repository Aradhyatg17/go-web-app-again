name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - run: go build -o go-web-app-again
    - run: go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5     
      with:
        go-version: '1.22'
    - uses: golangci/golangci-lint-action@v6
      with:
        version: v1.61.0

  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v1
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/deploy:${{ github.run_id }}

  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest
    needs: push
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}
    - run: sed -i 's/tag: .*/tag: "${{ github.run_id }}"/' helm/go-web-app-again-chart/values.yaml
    - run: |
        git config --global user.email "you@example.com"
        git config --global user.name "Your Name"
        git add helm/go-web-app-again-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push origin HEAD:main